<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>relay</title></head>
<body>
<script>
  window.__postWebhook = function (url, body) {
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body,
      keepalive: true
    })
    .then(function (r) { engine.call('OnWebhookResult', r.status); })
    .catch(function () { engine.call('OnWebhookResult', -1); });
  };
</script>
</body>
</html>
