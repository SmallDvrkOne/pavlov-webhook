<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>relay</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#eee;font-family:monospace}
    #log{position:absolute;left:0;top:0;padding:10px;font-size:22px;line-height:1.4;white-space:pre}
    .ok{color:#6f6} .bad{color:#f66} .dim{color:#888}
    #views{position:absolute;right:0;bottom:0;padding:8px}
    #views img{height:26px}
  </style>
</head>
<body>
  <div id="log">boot...</div>
  <div id="views"><img id="hits" alt="views"></div>
  <!-- REQUIRED: this is what defines `engine` (every Pavlov page loads it).
       - page at coui://uiresources/relay.html  -> src="js/cohtml.js"
       - page at coui://uiresources/Views/x.html -> src="../js/cohtml.js"
       - hosted remotely (GitHub Pages)          -> upload this cohtml.js next to the page -->
  <script src="cohtml.js"></script>
  <script>
    // Webhooks now fire ONLY when BP calls __postWebhook(url, body).
    // (optional fallback, used only if you re-enable the page-load test)
    var WEBHOOK = "https://discord.com/api/webhooks/XXXX/YYYY";

    var USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

    var logEl = document.getElementById('log');
    function log(s, cls){ try { logEl.innerHTML += '\n' + (cls ? ('<span class="'+cls+'">'+s+'</span>') : s); } catch(e){} }
    function call(n){
      try {
        if (typeof engine !== 'undefined' && engine.call && engine.isAttached){
          var p = engine.call(n);
          if (p && p.catch) p.catch(function(){});   // no RegisterForEvent binding -> ignore
        }
      } catch(e){}
    }

    window.onerror = function(m, u, l, c){ log('JS ERROR: ' + m + ' @' + l + ':' + c, 'bad'); };
    window.addEventListener('unhandledrejection', function(e){ log('JS REJECT: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'bad'); });

    log('JS: running');
    log('caps: fetch=' + (typeof fetch) + ' xhr=' + (typeof XMLHttpRequest) + ' engine=' + (typeof engine), 'dim');
    log('engine.isAttached=' + (typeof engine !== 'undefined' ? engine.isAttached : '(engine missing - cohtml.js did not load)'),
        (typeof engine !== 'undefined' && engine.isAttached) ? 'ok' : 'bad');
    if (typeof engine !== 'undefined' && !engine.isAttached){
      log('MOCK MODE: page is remote, so engine.on/call do NOT reach the game.', 'bad');
      log('For the bridge, load this page from coui://uiresources/<name>.html', 'bad');
    }
    call('OnJSAlive');

    // ---- signal the game we are ready: engine.call('ScriptingReady') is what fires C++ ScriptingReady ----
    if (typeof engine !== 'undefined'){
      engine.on('Ready', function(){
        log('engine Ready', 'ok');
        try { engine.synchronizeModels(); } catch(e){ log('synchronizeModels: ' + e, 'bad'); }
        // 'ScriptingReady' is a name each game actor registers itself. Use our own binding name.
        var p = engine.call('PageReady');
        if (p && p.catch) p.catch(function(){ log('PageReady not registered (add RegisterForEvent("PageReady"))', 'dim'); });
        log('called PageReady', 'ok');
      });
    }

    // local throttle so we never hammer Discord (1 send / 5s)
    var MIN_GAP_MS = 5000;
    var lastSend = 0;

    // XHR-based POST (Cohtml reliably supports XMLHttpRequest)
    function sendWebhook(url, body, tag, isRetry){
      try {
        var now = Date.now();
        if (!isRetry && now - lastSend < MIN_GAP_MS){
          log(tag + ' throttled locally (' + Math.ceil((MIN_GAP_MS - (now - lastSend)) / 1000) + 's left)', 'dim');
          return;
        }
        lastSend = now;

        var x = new XMLHttpRequest();
        x.open('POST', url + (url.indexOf('?') < 0 ? '?' : '&') + 'wait=true', true);
        x.setRequestHeader('Content-Type', 'application/json');
        try { x.setRequestHeader('User-Agent', USER_AGENT); } catch(e){ log(tag + ' UA header rejected: ' + e, 'bad'); }
        x.timeout = 10000;
        x.onreadystatechange = function(){
          if (x.readyState !== 4) return;
          if (x.status === 429){                       // rate limited
            var wait = 1.5;
            try { wait = JSON.parse(x.responseText).retry_after || wait; } catch(e){}
            log(tag + ' 429 rate limited, retrying in ' + wait + 's', 'bad');
            setTimeout(function(){ sendWebhook(url, body, tag, true); }, Math.ceil(wait * 1000) + 250);
            return;
          }
          var ok = (x.status >= 200 && x.status < 300);
          log(tag + ' POST -> HTTP ' + x.status, ok ? 'ok' : 'bad');
          call(ok ? 'OnWebhookOK' : 'OnWebhookFail');
        };
        x.onerror     = function(){ log(tag + ' POST -> network error', 'bad'); call('OnWebhookFail'); };
        x.ontimeout   = function(){ log(tag + ' POST -> timeout', 'bad'); call('OnWebhookFail'); };
        x.send(body);
        log(tag + ' XHR sent', 'dim');
      } catch(e){
        log(tag + ' XHR threw: ' + e, 'bad');
      }
    }

    // ---- 1) page-load webhook (the "is it Discord?" test) ----
    var TEST_ON_LOAD = false;  // off: a webhook is sent only when __postWebhook is called
    if (TEST_ON_LOAD && WEBHOOK.indexOf('XXXX') < 0) {
      log('sending page-load webhook...');
      sendWebhook(WEBHOOK, JSON.stringify({content:"page-load test from Cohtml"}), 'load');
    } else {
      log('page-load test off (or WEBHOOK unset)', 'dim');
    }

    // ---- 2) (removed) the api.github.com diagnostic hit GitHub's rate limit ----

    // ---- 3) binding for Blueprint-triggered sends ----
    try {
      function __postWebhook(url, body){
        log('GOT __postWebhook  url=' + url + '  body=' + body, 'ok');
        sendWebhook(url, body, 'bp');
      }
      window.__postWebhook = __postWebhook;      // fallback for engine.on-less builds
      var bound = false;
      if (typeof engine !== 'undefined' && engine.on){
        engine.on('__postWebhook', __postWebhook);
        bound = true;
      }
      log('__postWebhook bound: ' + (bound ? 'engine.on OK' : 'NO engine -> window fallback only'),
          bound ? 'ok' : 'bad');
    } catch(e){ log('binding threw: ' + e, 'bad'); }

    // ---- 4) view-count badge ----
    try {
      var img = document.getElementById('hits');
      img.onload  = function(){ log('views badge ok', 'ok');  call('OnViewCount'); };
      img.onerror = function(){ log('views badge FAIL', 'bad'); call('OnViewCountFail'); };
      img.src = 'https://hits.sh/smalldvrkone.github.io/pavlov-webhook.svg?label=views&t=' + Date.now();
    } catch(e){ log('badge threw: ' + e, 'bad'); }
  </script>
</body>
</html>
