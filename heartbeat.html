<script>
window.__postWebhook = function (url, body) {
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body,
    keepalive: true
  })
  .then(r => engineCallHandler.bindingCall('OnWebhookResult', r.status))
  .catch(_ => engineCallHandler.bindingCall('OnWebhookResult', -1));
};
</script>
